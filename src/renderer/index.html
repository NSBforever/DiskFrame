<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>DiskFrame</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: file: blob: media: localfile: https:; media-src 'self' file: blob: media: localfile: https: http://127.0.0.1:* http://localhost:*; connect-src 'self' https: data: blob: file: media: http://127.0.0.1:* http://localhost:*;"
    />
  </head>
  <body>
    <!-- Applied before the app bundle parses, so the first painted frame is
         already the right theme. Reading this asynchronously over IPC would
         paint dark first and then repaint - the theme flash. localStorage is
         synchronous and survives restarts, so it is both the store and the
         pre-paint source. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('diskframe-theme') || 'system'
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.themePref = pref
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <!-- Painted before the app bundle has even been evaluated, so the window
         opens on the drive page's own header instead of waiting ~0.5s for
         React's first render. React replaces it on mount. -->
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--app-bg,#0a0a0c);font-family:system-ui,sans-serif">
        <div style="font-size:20px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--app-fg,#f2f2f0)">Select a drive</div>
        <div style="font-size:11px;margin-top:6px;text-transform:uppercase;letter-spacing:1px;font-weight:600;color:var(--app-fg-dim,#8a8a8f)">Looking for drives…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
