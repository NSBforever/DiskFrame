[package]
name = "diskframe-mft"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["async", "napi4"] }
napi-derive = "2.16"
mft = "0.6"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_System_Threading"
] }

[build-dependencies]
napi-build = "2.1"
