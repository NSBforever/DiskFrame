<!doctype html>
<meta charset="utf-8" />
<!--
  Video controls, rendered INSIDE the mpv window.

  They cannot live in the main window: mpv's window is an owned top-level
  window (parent=0, owner=<main>), and Windows always z-orders an owned window
  above its owner, so main-window DOM is never visible over the video whatever
  its z-index. Chromium's surface is a CHILD of this window, and a child paints
  above its parent's own drawing, so this overlay does composite above mpv's
  output - verified with a real screen capture, not DOM state.

  Shortcuts are NOT handled here. The main window has focus during playback, so
  it owns the whole key table and drives mpv directly; any key that does land
  here is relayed to it. That keeps exactly one handler per press.
-->
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select:none; cursor:default;
    color:#f2f2f0; }

  /* Cinematic: no boxes over the picture, only soft scrims at the two edges.
     The top shows the filename and nothing else; every control is at the bottom. */
  #top, #bot { position:fixed; left:0; right:0; opacity:0; transition:opacity .25s ease;
    pointer-events:none; z-index:5; }
  #top.on { opacity:1; }
  #bot.on { opacity:1; pointer-events:auto; }
  #top { top:0; padding:16px 22px 44px;
    background:linear-gradient(to bottom, rgba(0,0,0,.62), rgba(0,0,0,0)); }
  #bot { bottom:0; padding:44px 16px 8px;
    background:linear-gradient(to top, rgba(0,0,0,.78), rgba(0,0,0,.38) 55%, rgba(0,0,0,0)); }

  #name { font-size:15px; font-weight:600; letter-spacing:.1px; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; color:#f2f2f0; text-shadow:0 1px 3px rgba(0,0,0,.6); max-width:80%; }

  button { background:transparent; border:0; color:#f2f2f0; cursor:pointer; padding:0;
    width:40px; height:40px; border-radius:50%; font:inherit; display:flex; align-items:center;
    justify-content:center; flex:0 0 auto; transition:background .12s, color .12s, opacity .12s; }
  button:hover:not([disabled]) { background:rgba(255,255,255,0.14); }
  button:active:not([disabled]) { background:rgba(255,255,255,0.22); }
  button[disabled] { opacity:.32; cursor:default; }
  button.on { color:#e11d2e; }
  button.on .ic { fill:currentColor; }
  .ic { width:22px; height:22px; pointer-events:none; }
  #play .ic { width:26px; height:26px; }
  #play.paused .ic { fill:currentColor; }
  #speed { width:auto; min-width:40px; padding:0 8px; border-radius:20px; font-size:13px;
    font-weight:600; font-variant-numeric:tabular-nums; }

  /* Timeline: thin until hovered, red played part, timestamp under the pointer. */
  #seek { position:relative; height:16px; display:flex; align-items:center; cursor:pointer; margin:0 4px; }
  #track { position:relative; height:3px; width:100%; background:rgba(255,255,255,.28);
    border-radius:2px; transition:height .12s; }
  #seek:hover #track, #seek.drag #track { height:5px; }
  #hover { position:absolute; left:0; top:0; bottom:0; width:0; background:rgba(255,255,255,.32); border-radius:2px; display:none; }
  #seek:hover #hover { display:block; }
  #fill { position:absolute; left:0; top:0; bottom:0; width:0%; background:#e11d2e; border-radius:2px; }
  #knob { position:absolute; top:50%; left:0%; width:13px; height:13px; margin-left:-6.5px;
    transform:translateY(-50%) scale(0); background:#e11d2e; border-radius:50%; transition:transform .12s; }
  #seek:hover #knob, #seek.drag #knob { transform:translateY(-50%) scale(1); }
  #tip { position:absolute; bottom:22px; transform:translateX(-50%); padding:4px 8px; border-radius:6px;
    background:rgba(16,16,20,.92); font-size:12px; font-weight:600; font-variant-numeric:tabular-nums;
    white-space:nowrap; display:none; pointer-events:none; border:1px solid rgba(255,255,255,.12); }
  #seek:hover #tip, #seek.drag #tip { display:block; }

  #row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:2px; }
  .grp { display:flex; align-items:center; gap:2px; min-width:0; }
  #time { font-size:13px; font-variant-numeric:tabular-nums; color:#e8e8ec; white-space:nowrap; margin-left:8px; }
  #time .dur { color:#a8a8b2; }
  #volwrap { display:flex; align-items:center; }
  #vol { width:0; opacity:0; transition:width .18s ease, opacity .18s; accent-color:#e11d2e; margin:0; cursor:pointer; }
  #volwrap:hover #vol, #vol.drag { width:76px; opacity:1; margin:0 6px 0 2px; }
  .sep { width:1px; height:20px; background:rgba(255,255,255,.18); margin:0 6px; }

  .menu { position:fixed; bottom:64px; right:14px; min-width:220px; max-height:60vh; overflow:auto; padding:6px;
    display:none; flex-direction:column; gap:1px; z-index:9; font-size:13px;
    background:rgba(20,20,24,.94); border:1px solid rgba(255,255,255,.12); border-radius:12px;
    box-shadow:0 12px 34px rgba(0,0,0,.55); }
  .menu.on { display:flex; }
  .menu h4 { margin:8px 10px 3px; font-size:10px; letter-spacing:.7px; text-transform:uppercase;
    color:#9a9aa6; font-weight:700; }
  .menu button { justify-content:flex-start; width:100%; height:auto; padding:8px 10px; border-radius:8px; }
  .menu button.sel { color:#e11d2e; font-weight:600; }
  .menu .none { padding:8px 10px; color:#9a9aa6; }

  #toast { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    padding:12px 20px; border-radius:12px; font-size:16px; font-weight:700;
    background:rgba(16,16,20,.78); border:1px solid rgba(255,255,255,.12);
    opacity:0; transition:opacity .18s; pointer-events:none; z-index:20; }
  #toast.on { opacity:1; }

  /* Narrow stage (Info panel open on a small window): drop the least-used. */
  @media (max-width: 720px) { #speed, #subs, .sep { display:none; } }
  @media (max-width: 560px) { #more, #info, #time .dur { display:none; } }
</style>

<div id="toast"></div>

<div id="top"><div id="name">&nbsp;</div></div>

<div id="moreMenu" class="menu">
  <h4>File</h4>
  <button data-act="reveal">Show in folder</button>
  <button data-act="copyPath">Copy path</button>
  <button data-act="download">Save a copy</button>
  <button data-act="delete">Delete</button>
</div>

<div id="bot">
  <div id="seek" role="slider" aria-label="Seek" tabindex="-1">
    <div id="track"><div id="hover"></div><div id="fill"></div><div id="knob"></div></div>
    <div id="tip">0:00</div>
  </div>
  <div id="row">
    <div class="grp">
      <button id="play" title="Play (Space or K)" aria-label="Play or pause"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg></button>
      <div id="volwrap">
        <button id="mute" title="Mute (M)" aria-label="Mute"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></button>
        <input id="vol" type="range" min="0" max="100" value="100" title="Volume (Up / Down)" aria-label="Volume" />
      </div>
      <span id="time">0:00 <span class="dur">/ 0:00</span></span>
    </div>
    <div class="grp">
      <button id="prev" title="Previous (Ctrl+Left)" aria-label="Previous"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" x2="5" y1="19" y2="5"/></svg></button>
      <button id="next" title="Next (Ctrl+Right)" aria-label="Next"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/></svg></button>
      <span class="sep"></span>
      <button id="fav" title="Favourite (Ctrl+L)" aria-label="Favourite"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></button>
      <button id="info" title="Info and properties" aria-label="Info"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></button>
      <button id="speed" title="Playback speed (Shift+. / Shift+,)" aria-label="Playback speed">1x</button>
      <button id="subs" title="Subtitles (C)" aria-label="Subtitles"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="14" x="3" y="5" rx="2" ry="2"/><path d="M7 15h4M15 15h2M7 11h2M13 11h4"/></svg></button>
      <button id="gear" title="Settings: speed, audio, subtitles" aria-label="Playback settings"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button id="more" title="More options" aria-label="More options"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
      <button id="full" title="Fullscreen (F)" aria-label="Fullscreen"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
      <button id="close" title="Close (Esc)" aria-label="Close viewer"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
  </div>
</div>

<div id="gearMenu" class="menu"></div>

<script>
  var api = window.api
  var ICON = {play:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>',pause:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>',replay:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>',vol:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>',mute:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg>',max:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>',min:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>'}
  function $(id) { return document.getElementById(id) }
  // NB: not `top` - window.top is a read-only global, so `var top` silently
  // keeps referring to the frame, and its .classList is undefined.
  var topBar = $('top'), bot = $('bot'), fill = $('fill'), knob = $('knob'), timeEl = $('time')
  var duration = 0, cur = 0, paused = true, muted = false, volume = 100, speed = 1
  var subTracks = [], subActive = false, hideT = 0, dragging = false, menuOpen = false
  var audioTracks = [], aid = null
  var lastT = null
  // The video has played to its end and is sitting on the last frame. mpv is
  // run with --keep-open=yes, so the session is alive and every control still
  // works - but Play has to mean "replay", because un-pausing at the end of a
  // file does nothing at all. The main process owns that rewrite; this is only
  // about saying so on screen and keeping the bar up.
  var isEnded = false

  function fmt(s) {
    if (!isFinite(s) || s < 0) s = 0
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = Math.floor(s % 60)
    var mm = (h > 0 && m < 10 ? '0' : '') + m
    return (h > 0 ? h + ':' : '') + mm + ':' + (r < 10 ? '0' : '') + r
  }

  function render() {
    var pct = duration > 0 ? Math.min(100, (cur / duration) * 100) : 0
    fill.style.width = pct + '%'
    knob.style.left = pct + '%'
    $('seek').setAttribute('aria-valuenow', Math.round(pct))
    timeEl.innerHTML = fmt(cur) + ' <span class="dur">/ ' + fmt(duration) + '</span>'
    var playIcon = isEnded ? 'replay' : paused ? 'play' : 'pause'
    if ($('play').dataset.icon !== playIcon) { $('play').innerHTML = ICON[playIcon]; $('play').dataset.icon = playIcon }
    $('play').className = paused && !isEnded ? 'paused' : ''
    $('play').title = (isEnded ? 'Replay from the beginning' : paused ? 'Play' : 'Pause') + ' (Space or K)'
    var volIcon = (muted || volume === 0) ? 'mute' : 'vol'
    if ($('mute').dataset.icon !== volIcon) { $('mute').innerHTML = ICON[volIcon]; $('mute').dataset.icon = volIcon }
    $('mute').title = (muted ? 'Unmute' : 'Mute') + ' (M)'
    $('speed').textContent = speed + 'x'
    var noSubs = subTracks.length === 0
    $('subs').disabled = noSubs
    $('subs').className = (!noSubs && subActive) ? 'on' : ''
    $('subs').title = noSubs ? 'No subtitle tracks in this file' : 'Subtitles (C)'
  }

  function toast(msg) {
    var t = $('toast')
    t.textContent = msg
    t.classList.add('on')
    clearTimeout(t._t)
    t._t = setTimeout(function () { t.classList.remove('on') }, 950)
  }

  // Both bars share one visibility rule. `sticky` pins them (paused, hovering,
  // dragging the timeline, a menu open) until that condition clears.
  function show(sticky) {
    topBar.classList.add('on'); bot.classList.add('on')
    if (api && api.setOverlayInteractive) api.setOverlayInteractive(true)
    clearTimeout(hideT)
    if (sticky === false) return
    // A finished video keeps its controls: they are the only way back into it.
    if (paused || isEnded || dragging || menuOpen) return
    hideT = setTimeout(function () {
      topBar.classList.remove('on'); bot.classList.remove('on')
      closeMenus()
      if (api && api.setOverlayInteractive) api.setOverlayInteractive(false)
    }, 3000)
  }
  window.__overlayShow = show
  window.__overlayToast = toast

  function closeMenus() {
    $('moreMenu').classList.remove('on')
    $('gearMenu').classList.remove('on')
    menuOpen = false
  }

  show()
  // Only real movement: a mouse-move with the pointer where it was is Windows
  // re-announcing it after this window starts or stops taking the mouse, and
  // answering it would keep the bar from ever fading.
  var lastPos = ''
  document.addEventListener('mousemove', function (e) {
    var p = e.screenX + ',' + e.screenY
    if (p === lastPos) return
    lastPos = p
    show()
  }, { passive: true })
  ;[bot].forEach(function (el) {
    el.addEventListener('mouseenter', function () { show(false) })
    el.addEventListener('mouseleave', function () { show() })
    el.addEventListener('focusin', function () { show(false) })
    el.addEventListener('focusout', function () { show() })
  })

  // ---- state in ----
  if (api && api.onMpvPropertyChange) {
    api.onMpvPropertyChange(function (d) {
      var name = d.name, value = d.value
      if (name === 'time-pos' && typeof value === 'number') {
        // `pause` is edge-triggered: mpv emits it once when the property is
        // observed, which happens before this listener exists, so a file
        // played straight through never reports its state and `paused` would
        // stay true forever - which silently disabled the idle fade. A
        // position that moved forward means it is playing.
        if (lastT !== null && value > lastT && paused) { paused = false; show() }
        lastT = value
        if (!dragging) cur = value
      }
      else if (name === 'duration' && typeof value === 'number') duration = value
      else if (name === 'pause' && typeof value === 'boolean') { paused = value; show() }
      else if (name === 'ended' && typeof value === 'boolean') {
        isEnded = value
        // mpv pauses itself about 100ms after the end is reached; saying so
        // now avoids a flash of the Pause icon on a video that has stopped.
        if (value) { paused = true; lastT = null }
        show()
      }
      else if (name === 'volume' && typeof value === 'number') { volume = Math.round(value); $('vol').value = volume }
      else if (name === 'mute' && typeof value === 'boolean') muted = value
      else if (name === 'speed' && typeof value === 'number') speed = Math.round(value * 100) / 100
      else if (name === 'sid') subActive = value !== false && value !== 'no' && value != null
      else if (name === 'track-list' && Array.isArray(value)) {
        subTracks = value.filter(function (t) { return t.type === 'sub' })
        audioTracks = value.filter(function (t) { return t.type === 'audio' })
        var a = audioTracks.filter(function (t) { return t.selected })[0]
        aid = a ? a.id : null
        buildGearMenu()
      } else return
      render()
    })
  }

  // Filename and favourite state come from the main renderer.
  if (api && api.onOverlayMeta) {
    api.onOverlayMeta(function (m) {
      if (m && typeof m.name === 'string') $('name').textContent = m.name
      if (m && typeof m.isFav === 'boolean') {
        $('fav').className = m.isFav ? 'on' : ''
        $('fav').title = (m.isFav ? 'Remove from favourites' : 'Favourite') + ' (Ctrl+L)'
      }
      if (m && typeof m.hasPrev === 'boolean') $('prev').disabled = !m.hasPrev
      if (m && typeof m.hasNext === 'boolean') $('next').disabled = !m.hasNext
      if (m && typeof m.fullscreen === 'boolean') {
        $('full').innerHTML = m.fullscreen ? ICON.min : ICON.max
        $('full').title = (m.fullscreen ? 'Exit full screen' : 'Full screen') + ' (F)'
      }
      if (m && typeof m.info === 'boolean') $('info').className = m.info ? 'on' : ''
      if (m && m.toast) toast(m.toast)
      if (m && m.show) show()
      render()
    })
  }

  // ---- commands out ----
  function cmd(c, a) { if (api && api.sendMpvCommand) api.sendMpvCommand(c, a || []) }
  function act(n) { if (api && api.overlayAction) api.overlayAction(n) }

  function seekTo(e) {
    var r = $('seek').getBoundingClientRect()
    var p = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width))
    cur = p * duration
    render()
    cmd('seek', [cur, 'absolute'])
  }
  $('seek').addEventListener('mousedown', function (e) {
    dragging = true; $('seek').classList.add('drag'); seekTo(e); show(false)
  })
  document.addEventListener('mousemove', function (e) { if (dragging) seekTo(e) })
  $('seek').addEventListener('mousemove', function (e) {
    var r = $('seek').getBoundingClientRect()
    var p = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width))
    var tip = $('tip')
    tip.textContent = fmt(p * duration)
    var half = tip.offsetWidth / 2
    tip.style.left = Math.max(half, Math.min(r.width - half, e.clientX - r.left)) + 'px'
    $('hover').style.width = p * 100 + '%'
  })
  $('vol').addEventListener('mousedown', function () { $('vol').classList.add('drag') })
  document.addEventListener('mouseup', function () { $('vol').classList.remove('drag') })
  document.addEventListener('mouseup', function () {
    if (!dragging) return
    dragging = false; $('seek').classList.remove('drag'); show()
  })

  $('play').onclick = function () {
    cmd('set_property', ['pause', !paused])
    toast(isEnded ? 'Replay' : paused ? 'Play' : 'Paused')
  }
  $('mute').onclick = function () { cmd('set_property', ['mute', !muted]); toast(muted ? 'Unmuted' : 'Muted') }
  $('vol').oninput = function (e) {
    var v = Number(e.target.value)
    cmd('set_property', ['volume', v]); cmd('set_property', ['mute', false])
    toast('Volume ' + v + '%')
  }
  var SPEEDS = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2]
  $('speed').onclick = function () {
    var i = SPEEDS.indexOf(speed)
    var next = SPEEDS[(i < 0 ? 3 : i + 1) % SPEEDS.length]
    cmd('set_property', ['speed', next]); toast(next + 'x')
  }
  $('subs').onclick = function () {
    if (subTracks.length === 0) { toast('No subtitles in this file'); return }
    cmd('cycle', ['sub']); toast('Subtitles')
  }
  $('prev').onclick = function () { act('prev') }
  $('next').onclick = function () { act('next') }
  $('full').onclick = function () { act('fullscreen') }
  $('close').onclick = function () { act('close') }
  $('fav').onclick = function () { act('fav') }
  $('info').onclick = function () { act('info') }

  $('more').onclick = function (e) {
    e.stopPropagation()
    var m = $('moreMenu')
    var open = !m.classList.contains('on')
    closeMenus(); if (open) { m.classList.add('on'); menuOpen = true }
    show(open ? false : true)
  }
  $('moreMenu').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-act]')
    if (!b) return
    act(b.getAttribute('data-act')); closeMenus(); show()
  })

  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c] }) }
  function trackName(t) { return esc([t.lang, t.title].filter(Boolean).join(' - ') || ('Track ' + t.id)) }
  function buildGearMenu() {
    var m = $('gearMenu')
    var html = '<h4>Speed</h4>'
    SPEEDS.forEach(function (s) {
      html += '<button data-speed="' + s + '"' + (s === speed ? ' class="sel"' : '') + '>' + (s === 1 ? 'Normal' : s + 'x') + '</button>'
    })
    html += '<h4>Audio</h4>'
    if (audioTracks.length === 0) html += '<div class="none">No audio in this file</div>'
    else audioTracks.forEach(function (t) {
      html += '<button data-aid="' + t.id + '"' + (t.id === aid ? ' class="sel"' : '') + '>' + trackName(t) + '</button>'
    })
    html += '<h4>Subtitles</h4>'
    if (subTracks.length === 0) html += '<div class="none">None in this file</div>'
    else {
      html += '<button data-sid="no"' + (!subActive ? ' class="sel"' : '') + '>Off</button>'
      subTracks.forEach(function (t) {
        html += '<button data-sid="' + t.id + '"' + (subActive && t.selected ? ' class="sel"' : '') + '>' + trackName(t) + '</button>'
      })
    }
    m.innerHTML = html
  }
  buildGearMenu()
  $('gear').onclick = function (e) {
    e.stopPropagation()
    var m = $('gearMenu')
    var open = !m.classList.contains('on')
    closeMenus(); buildGearMenu()
    if (open) { m.classList.add('on'); menuOpen = true }
    show(open ? false : true)
  }
  $('gearMenu').addEventListener('click', function (e) {
    var b = e.target.closest('button')
    if (!b) return
    if (b.hasAttribute('data-speed')) {
      var s = Number(b.getAttribute('data-speed'))
      cmd('set_property', ['speed', s]); toast(s + 'x')
    } else if (b.hasAttribute('data-aid')) {
      cmd('set_property', ['aid', Number(b.getAttribute('data-aid'))]); toast('Audio track')
    } else if (b.hasAttribute('data-sid')) {
      var sid = b.getAttribute('data-sid')
      cmd('set_property', ['sid', sid === 'no' ? 'no' : Number(sid)])
      toast(sid === 'no' ? 'Subtitles off' : 'Subtitles on')
    }
    closeMenus(); show()
  })
  document.addEventListener('click', function () { if (menuOpen) { closeMenus(); show() } })

  // Any key that lands here is relayed; the main window owns the key table.
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && menuOpen) { closeMenus(); show(); e.preventDefault(); return }
    if (e.repeat && (e.key === ' ' || e.key === 'k' || e.key === 'K' || e.key === 'm' || e.key === 'M')) return
    act('key:' + e.key + (e.shiftKey ? ':shift' : '') + (e.ctrlKey ? ':ctrl' : ''))
    e.preventDefault()
  })

  render()
</script>
