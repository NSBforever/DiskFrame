appId: com.electron.app
productName: diskframe
directories:
  buildResources: build
# An allowlist: the built app, its runtime resources and package.json.
# Production node_modules are added by electron-builder. A blocklist here used
# to ship scratch/, graphify-out/, .claude/, test scripts and images inside
# app.asar.
files:
  - out/**/*
  - resources/**/*
  - package.json
asarUnpack:
  - resources/**
  - node_modules/ffmpeg-static/**/*
  - node_modules/ffprobe-static/bin/win32/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  executableName: diskframe
  verifyUpdateCodeSignature: false
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
afterPack: scripts/verify-pack.cjs
# Updates come from GitHub Releases: every release must carry latest.yml and
# the installer's .blockmap next to the installer, or installed copies cannot
# see it. electron-updater reads the app-update.yml this generates.
publish:
  provider: github
  owner: NSBforever
  repo: DiskFrame
